<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Artigo do blog Eu + IA, com prompts reais e bastidores de criacao."
    />
    <title>Artigo | Eu + IA</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="article-page">
    <div class="site-shell">
      <header class="article-topbar">
        <a class="back-link" href="/" aria-label="Voltar para a pagina inicial do blog">

        <a class="brand-link" href="/" aria-label="Ir para a pagina inicial">Eu + IA</a>

            <p id="article-description" class="article-description"></p>

          <footer id="article-footer" class="article-footer"></footer>

    <script type="module" src="/src/article.ts"></script>
